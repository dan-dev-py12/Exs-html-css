
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cards de produtos</title>

    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>

    <header>
        <h1>Produtos</h1>
    </header>

    <main>
        <div class="container">

            <article class="card-produto">
                <img src="imgs/fone.png" alt="Fone de ouvido Beats">

                <h2 class="nome-produto">Beats by Dre C3450</h2>

                <p class="preco-produto">$ 39.60</p>

                <hr>

                <p class="descricao">
                    50mm drivers, Bluetooth V5, 800mAh Battery
                </p>

                <a href="#" class="btn">Add to cart</a>
            </article>

            <article class="card-produto">
                <img src="imgs/foneSemFio.png" alt="Fone de ouvido sem fio">

                <h2 class="nome-produto">Rockerz 195V2 Pro</h2>

                <p class="preco-produto">$ 39.60</p>

                <hr>

                <p class="descricao">
                    50mm drivers, Bluetooth V5, 800mAh Battery
                </p>

                <a href="#" class="btn">Add to cart</a>
            </article>

            <article class="card-produto">
                <img src="imgs/Relogio.png" alt="Relógio Wave Style">

                <h2 class="nome-produto">Wave Style Call ICC Edition</h2>

                <p class="preco-produto">$ 39.60</p>

                <hr>

                <p class="descricao">
                    50mm drivers, Bluetooth V5, 800mAh Battery
                </p>

                <a href="#" class="btn">Add to cart</a>
            </article>

        </div>
    </main>

</body>
</html>
